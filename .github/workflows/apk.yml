name: Construire l'APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Créer le projet Android
        run: |
          P=android/app/src/main
          mkdir -p $P/java/com/goldolero/reprise $P/assets $P/res/mipmap-xxxhdpi
          cp index.html $P/assets/index.html
          sed -i -e 's#<link[^>]*fonts\.g[a-z]*\.com[^>]*>##g' -e 's#"Barlow Condensed",#"Barlow Condensed","sans-serif-condensed",#g' $P/assets/index.html
          cp icon-192.png $P/res/mipmap-xxxhdpi/ic_launcher.png

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "Reprise"
          include ':app'
          EOF

          cat > android/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.goldolero.reprise'
            compileSdk 34
            defaultConfig {
              applicationId 'com.goldolero.reprise'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          cat > $P/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:label="Programme course"
              android:icon="@mipmap/ic_launcher"
              android:theme="@android:style/Theme.Material.NoActionBar">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > $P/java/com/goldolero/reprise/MainActivity.java <<'EOF'
          package com.goldolero.reprise;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView web;

            @Override
            protected void onCreate(Bundle state) {
              super.onCreate(state);
              web = new WebView(this);
              WebSettings s = web.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              web.setBackgroundColor(Color.parseColor("#0E1A18"));
              web.setWebViewClient(new WebViewClient());
              setContentView(web);
              web.loadUrl("file:///android_asset/index.html");
            }

            @Override
            public void onBackPressed() {
              if (web.canGoBack()) web.goBack(); else super.onBackPressed();
            }
          }
          EOF

      - name: Compiler l'APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Reprise.apk

      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Reprise (version ${{ github.run_number }})
          files: Reprise.apk
